<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Snake Game - JavaScript</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Snake Pro</h1>
    <p class="info">Score: <span id="score">0</span> | Best: <span id="best">0</span></p>
    <canvas id="game" width="600" height="400"></canvas>
    <p class="controls">Arrow keys to move | Space to pause/restart</p>

    <div id="overlay" class="overlay">
        <h2>SNAKE PRO</h2>
        <p>Press SPACE or click Start to play</p>
        <button id="startBtn">Start Game</button>
    </div>

    <script src="snake.js"></script>
</body>
</html>
